# Apache on kube: public front end for wiki.machs.org.
# Installed as /etc/apache2/sites-available/000-default.conf by
# deploy/apache-setup.sh. Edit this file and rerun the script, not the copy.
# Switching between Apache and direct-to-container: see deploy/FRONT-END.md.
#
# *:80 / *:443, not wiki.machs.org:80: a hostname here is resolved at startup
# to the public IP, which isn't a local address, so the vhost never matched.

# Port 80: Let's Encrypt challenges (certbot webroot) + redirect to HTTPS.
<VirtualHost *:80>
    ServerName wiki.machs.org
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Challenge files must stay reachable over plain HTTP, or renewal fails.
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://wiki.machs.org/$1"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Port 443: TLS here (host-patched by unattended-upgrades), then proxy to the
# foswiki container's nginx on 127.0.0.1:8443.
<VirtualHost *:443>
    ServerName wiki.machs.org
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/wiki.machs.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wiki.machs.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Lets deploy/front-end-check.sh tell which path public traffic takes.
    Header always set X-Front-End "apache"
    # HSTS comes from Foswiki's SecurityHeadersPlugin (1 year), not here, to
    # avoid sending the header twice.

    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyTimeout      300
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy adds X-Forwarded-For; the container's nginx trusts it from
    # Docker addresses only (set_real_ip_from in https/nginx.default.conf).

    # The container serves the same public cert, which doesn't name 127.0.0.1,
    # so skip peer checks on this loopback hop.
    SSLProxyEngine           On
    SSLProxyVerify           none
    SSLProxyCheckPeerName    off
    SSLProxyCheckPeerCN      off
    SSLProxyCheckPeerExpire  off

    ProxyPass        / https://127.0.0.1:8443/
    ProxyPassReverse / https://127.0.0.1:8443/

    ErrorLog  ${APACHE_LOG_DIR}/wiki-error.log
    CustomLog ${APACHE_LOG_DIR}/wiki-access.log combined
</VirtualHost>
