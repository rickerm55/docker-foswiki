services:

  foswiki:
    # Built locally from this repo's Dockerfile (upstream image isn't rebuilt).
    # Rebuild every month or two for security fixes: see README-local-build.md.
    # Previous: timlegge/docker-foswiki:latest (kept on disk for rollback)
    image: foswiki-local:2026-11-25b
    restart: always
    labels:
      - com.getarcaneapp.arcane.updater=false   # local image: Arcane can't update it
    depends_on: 
      solr:
         condition: service_healthy
    networks:
      - frontend
      - backend
    # Loopback only: host Apache is the public front end and proxies to
    # 127.0.0.1:8443 (deploy/FRONT-END.md). Remove "127.0.0.1:" to expose again.
    ports:
      - "127.0.0.1:8765:80"
      - "127.0.0.1:8443:443"
    volumes:
      - solr_logs:/opt/solr/server/logs:z
      - solr_configsets:/opt/solr/server/solr/configsets:z
      - solr_foswiki:/opt/solr/server/solr/solr_foswiki:z
      - foswiki_www:/var/www/foswiki:z
      - ./https/nginx.default.conf:/etc/nginx/http.d/default.conf:z
      - ./https/docker-foswiki.crt:/etc/nginx/docker-foswiki.crt:z
      - ./https/docker-foswiki.key:/etc/nginx/docker-foswiki.key:z

  # Solr 9 for SolrPlugin 10.x (Solr 5 lacked fields the plugin needs; search broke ~2026-04).
  # Configset in ./solr9 comes from SolrPlugin's solr_9/ dir. On first start, solr-precreate
  # copies it into the solr9_data volume; after a configset change, see README-local-build.md.
  # Rollback: image solr:5 + the old volume lines (git history); the old volumes are untouched.
  solr:
    image: solr:9-slim
    command: solr-precreate foswiki /opt/solr/server/solr/configsets/foswiki_configs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/foswiki/admin/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - backend
    volumes:
      - solr9_data:/var/solr
      - ./solr9/configsets/foswiki_configs:/opt/solr/server/solr/configsets/foswiki_configs:ro
    ulimits:
      nofile: 65000           # Solr warns at the default 1024
    environment:
      - SOLR_HEAP=1g
      # Make new/edited pages searchable within ~6 s (same values the Solr 5 core used)
      - SOLR_OPTS=-Dsolr.autoSoftCommit.maxTime=6000 -Dsolr.autoCommit.maxTime=15000
      - SOLR_LOG_LEVEL=WARN

volumes:
  foswiki_www:
  solr9_data:
  # Solr 5 leftovers, still mounted by the foswiki service (the entrypoint expects the paths).
  solr_configsets:
  solr_foswiki:
  solr_logs:

networks:
  frontend:
  backend:
    internal: true
